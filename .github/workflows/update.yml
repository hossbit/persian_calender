name: تمدید خودکار تقویم شمسی
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/update.yml'
permissions:
  contents: write
concurrency:
  group: persian-calendar
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: تولید تاریخ‌های فارسی
        run: node scripts/generate.mjs
      - name: دریافت خودکار تعطیلات و مناسبت‌ها
        run: node scripts/occasions.mjs
      - name: ساخت حالت‌های مختلف اشتراک
        run: node scripts/variants.mjs
      - name: بررسی تاریخ‌ها و ساختار تقویم
        run: |
          node scripts/test.mjs
          node scripts/test-occasions.mjs
          node scripts/test-variants.mjs
      - name: انتشار در همان لینک ثابت
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feeds/ data/
          if ! git diff --cached --quiet; then
            git commit -m 'تمدید خودکار تقویم شمسی'
            git pull --rebase origin main
            git push
          fi
