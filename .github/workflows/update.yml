name: دستیار به‌روزرسانی تقویم
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/update.yml'
permissions:
  contents: write
concurrency:
  group: persian-calendar
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: بررسی اعتبارسنجی منبع و مدیریت خطا
        run: |
          node scripts/test-source.mjs
          node scripts/test-time-ir.mjs
      - name: تولید تاریخ‌های فارسی
        run: node scripts/generate.mjs
      - name: دریافت خودکار تعطیلات و مناسبت‌ها
        run: node scripts/occasions.mjs
      - name: ساخت حالت‌های مختلف اشتراک
        run: node scripts/variants.mjs
      - name: بررسی تاریخ‌ها و ساختار تقویم
        run: |
          node scripts/test.mjs
          node scripts/test-occasions.mjs
          node scripts/test-variants.mjs
      - name: انتشار در همان لینک ثابت
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feeds/ data/
          if ! git diff --cached --quiet; then
            git commit -m 'تمدید خودکار تقویم شمسی'
            git pull --rebase -X theirs origin main
            git push
          fi
